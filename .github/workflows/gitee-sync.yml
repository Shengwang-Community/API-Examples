name: gitee-sync
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: gitee-sync
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Debug SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITEE_PI_SSH }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ls -la ~/.ssh/id_rsa
          echo "Testing SSH key format:"
          head -n 1 ~/.ssh/id_rsa
          tail -n 1 ~/.ssh/id_rsa
          ssh-keygen -l -f ~/.ssh/id_rsa || true
          echo "Adding gitee.com to known_hosts:"
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts
          echo "Testing SSH connection:"
          ssh -vT git@gitee.com || true
          
      - name: Gitee sync repo
        uses: xgfd3/hub-mirror-action@v1.4
        with:
          src: github/Shengwang-Community
          dst: gitee/agoraio-community
          white_list: "API-Examples"
          static_list: "API-Examples"
          cache_path: "./cache"
          dst_key: ${{ secrets.GITEE_PI_SSH }}
          dst_token: ${{ secrets.GITEE_PRIVATE_TOKEN }}
          force_update: true
          account_type: org
          shell_path: ./.github/workflows/gitee-sync-shell.sh
          github_ref: ${{ github.ref }}
          debug: true  
