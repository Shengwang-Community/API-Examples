name: gitee-sync
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: gitee-sync
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    if: github.actor != 'dependabot[bot]' && github.ref == 'refs/heads/main'
    steps:
      - name: Gitee sync repo
        uses: xgfd3/hub-mirror-action@1114fedb661f99966a6d857041f91fda6ef7575b # v1.4
        with:
          src: github/Shengwang-Community
          dst: gitee/agoraio-community
          white_list: "API-Examples"
          static_list: "API-Examples"
          cache_path: "./cache"
          dst_key: ${{ secrets.GITEE_PI_SSH }}
          dst_token: ${{ secrets.GITEE_PRIVATE_TOKEN }}
          force_update: true
          account_type: org
          # github_ref makes v1.4 recreate the already checked-out main branch.
          shell_path: ./.github/ci/sync/gitee-sync.sh

      - name: Verify post-sync customization
        run: test "$(cat ./cache/API-Examples/.git/gitee-sync-status)" = "0"
