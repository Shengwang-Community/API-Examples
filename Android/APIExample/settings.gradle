pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // Resolve RTC SDK modules and their infrastructure dependencies from the official source.
        exclusiveContent {
            forRepository {
                maven { url = 'https://download.shengwang.cn/maven/' }
            }
            filter {
                includeGroup("cn.shengwang.rtc")
                includeGroup("cn.shengwang.infra")
            }
        }
        google()
        mavenCentral()
        maven {
            url 'http://maven.faceunity.com/repository/maven-public/'
            allowInsecureProtocol = true
        }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
    }
}
rootProject.name = 'Shengwang-APIExample'
include ':app'
if (simpleFilter.toBoolean()) {
    include ':agora-simple-filter'
}
if (streamEncrypt.toBoolean()) {
    include ':agora-stream-encrypt'
}
